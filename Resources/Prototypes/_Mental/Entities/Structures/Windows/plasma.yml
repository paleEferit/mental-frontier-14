- type: entity
  parent: PlasmaWindow
  id: PlasmaWindowLowerHalfTilt
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Mental/Structures/Windows/plasma_lower_half_tilt.rsi # Mental
    state: state0
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    mode: Diagonal
    key: walls # Frontier: windows<walls
    base: state
  - type: Icon
    sprite: _Mental/Structures/Windows/plasma_lower_half_tilt.rsi # Mental
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "0.5,0.5"
            - "0.5,-0.5"
            - "-0.5,-0.5"
            - "0,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: _Mental/Structures/Windows/cracks_lower_half_tilt.rsi
  - type: Construction
    graph: WindowLowerHalfTilt
    node: plasmaWindowLowerHalfTilt

