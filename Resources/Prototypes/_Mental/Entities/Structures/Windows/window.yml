- type: entity
  parent: Window
  id: WindowLowerHalfTiltLeft
  suffix: tilted
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Mental/Structures/Windows/window_lower_half_tilt_left.rsi # TODO: fix sprite borders on repeat
    state: state0
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    mode: Diagonal
    base: state
  - type: Icon
    sprite: _Mental/Structures/Windows/window_lower_half_tilt_left.rsi # TODO: fix sprite borders on repeat
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "0.5,0.5"
            - "0.5,-0.5"
            - "-0.5,-0.5"
            - "0,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: _Mental/Structures/Windows/cracks_lower_half_tilt_left.rsi
  - type: Construction
    graph: WindowLowerHalfTiltLeft
    node: windowLowerHalfTiltLeft

