- type: entity
  abstract: true
  parent: BaseStructureWall
  id: WallDiagonalQuarterBase
  suffix: quarter
  components:
  - type: Tag
    tags:
    - Wall
    - Diagonal
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - "0,-0.5"
          - "0.5,-0.5"
          - "0.5,0"
        mask:
        - FullTileMask
        layer:
        - WallLayer

- type: entity
  parent: WallDiagonalQuarterBase
  id: WallSolidDiagonalQuarter
  name: solid wall
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Mental/Structures/Walls/solid_wall_diagonal_quarter.rsi # Frontier: use _NF variant
    state: state0
  - type: Icon
    sprite: _Mental/Structures/Walls/solid_wall_diagonal_quarter.rsi # Frontier: use _NF variant
    state: state0
  # Mental: make diagonal wall removable by RCD
  - type: RCDDeconstructable
    cost: 6
    delay: 8
  # Mental: adding option to construct
  - type: Construction
    graph: GirderDiagonalQuarter
    node: wallSolidDiagonalQuarter
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girderDiagonalQuarter
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: WallDiagonalQuarterBase
  id: WallReinforcedDiagonalQuarter
  name: reinforced wall
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Mental/Structures/Walls/reinforced_wall_diagonal_quarter.rsi
    state: state0
  - type: IconSmooth
    mode: DiagonalNF
    key: walls
    base: state
  - type: Icon
    sprite: _Mental/Structures/Walls/reinforced_wall_diagonal_quarter.rsi
    state: state0
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Construction
    graph: GirderDiagonalQuarter
    node: wallReinforcedDiagonalQuarter
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girderDiagonalQuarter
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: RadiationBlocker
    resistance: 5

- type: entity
  parent: WallDiagonalQuarterBase
  id: WallShuttleDiagonalQuarter
  name: shuttle wall
  components:
  - type: Sprite
    drawdepth: Walls
    sprite:  _Mental/Structures/Walls/shuttle_diagonal_quarter.rsi
    state: state0
  - type: Icon
    sprite:  _Mental/Structures/Walls/shuttle_diagonal_quarter.rsi
    state: state0
#  - type: Reflect # Frontier
#    reflectProb: 1 # Frontier
  - type: Pullable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "0,-0.5"
            - "0.5,-0.5"
            - "0.5,0"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girderDiagonalQuarter
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
  # Mental - moved to another build graph
    graph: GirderDiagonalQuarter
    node: wallShuttleDiagonalQuarter
  - type: RadiationBlocker
    resistance: 5
  - type: StaticPrice
    price: 100 # Frontier: 200<100 - makes some shuttles way more expensive otherwise
  - type: RCDDeconstructable #Frontier
    cost: 6 #Frontier
    delay: 8 #Frontier
    fx: EffectRCDDeconstruct8 #Frontier

