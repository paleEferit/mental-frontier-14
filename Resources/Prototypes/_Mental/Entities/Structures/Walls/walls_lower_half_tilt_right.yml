- type: entity
  abstract: true
  parent: BaseStructureWall
  id: WallLowerHalfTiltRightBase
  suffix: tilted
  components:
  - type: Tag
    tags:
    - Wall
    - Diagonal
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - West
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "0.5,-0.5"
            - "-0.5,-0.5"
            - "-0.5,0.5"
            - "0,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: PolygonOccluder
    vertices:
    - "0.5,-0.5"
    - "-0.5,-0.5"
    - "-0.5,0.5"
    - "0,0.5"

- type: entity
  parent: WallLowerHalfTiltRightBase
  id: WallSolidLowerHalfTiltRight
  name: solid wall
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Mental/Structures/Walls/solid_wall_lower_half_tilt_right.rsi # Frontier: use _NF variant
    state: state0
  - type: Icon
    sprite: _Mental/Structures/Walls/solid_wall_lower_half_tilt_right.rsi # Frontier: use _NF variant
    state: state0
  # Mental: make diagonal wall removable by RCD
  - type: RCDDeconstructable
    cost: 6
    delay: 8
  # Mental: adding option to construct
  - type: Construction
    graph: GirderLowerHalfTiltRight
    node: wallSolidLowerHalfTiltRight
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girderLowerHalfTiltRight
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: WallLowerHalfTiltRightBase
  id: WallReinforcedLowerHalfTiltRight
  name: reinforced wall
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Mental/Structures/Walls/reinforced_wall_lower_half_tilt_right.rsi
    state: state0
  - type: IconSmooth
    mode: DiagonalNF
    key: walls
    base: state
  - type: Icon
    sprite: _Mental/Structures/Walls/reinforced_wall_lower_half_tilt_right.rsi
    state: state0
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Construction
    graph: GirderLowerHalfTiltRight
    node: wallReinforcedLowerHalfTiltRight
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girderLowerHalfTiltRight
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: RadiationBlocker
    resistance: 5
