    drawdepth: Walls
    sprite:  _Mental/Structures/Walls/shuttle_upper_half_tilt_right.rsi
    state: state0
  - type: Icon
    sprite:  _Mental/Structures/Walls/shuttle_upper_half_tilt_right.rsi
    state: state0
#  - type: Reflect # Frontier
#    reflectProb: 1 # Frontier
  - type: Pullable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "0,-0.5"
            - "-0.5,-0.5"
            - "-0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girderUpperHalfTiltRight
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
  # Mental - moved to another build graph
    graph: GirderUpperHalfTiltRight
    node: wallShuttleUpperHalfTiltRight
  - type: RadiationBlocker
    resistance: 5
  - type: StaticPrice
    price: 100 # Frontier: 200<100 - makes some shuttles way more expensive otherwise
  - type: RCDDeconstructable #Frontier
    cost: 6 #Frontier
    delay: 8 #Frontier
    fx: EffectRCDDeconstruct8 #Frontier

