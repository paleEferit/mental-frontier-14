- type: entity
  abstract: true
  parent: BaseStructureWall
  id: WallWedgeBase
  suffix: wedge
  components:
  - type: Tag
    tags:
    - Wall
    - Diagonal
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - "0.5,-0.5"
          - "-0.5,-0.5"
          - "0,0"
        mask:
        - FullTileMask
        layer:
        - WallLayer

- type: entity
  parent: WallWedgeBase
  id: WallSolidWedge
  name: solid wall
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Mental/Structures/Walls/solid_wall_wedge.rsi # Frontier: use _NF variant
    state: state0
  - type: Icon
    sprite: _Mental/Structures/Walls/solid_wall_wedge.rsi # Frontier: use _NF variant
    state: state0
  # Mental: make diagonal wall removable by RCD
  - type: RCDDeconstructable
    cost: 6
    delay: 8
  # Mental: adding option to construct
  - type: Construction
    graph: GirderWedge
    node: wallSolidWedge
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girderWedge
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
