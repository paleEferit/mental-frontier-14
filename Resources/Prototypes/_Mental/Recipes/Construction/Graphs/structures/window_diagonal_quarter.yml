- type: constructionGraph
  id: WindowDiagonalQuarter
  start: start
  graph:
    - node: start
      edges:
        - to: plasmaWindowDiagonalQuarter
          steps:
            - material: PlasmaGlass
              amount: 2
              doAfter: 2

        - to: windowDiagonalQuarter
          steps:
            - material: Glass
              amount: 2
              doAfter: 3

    - node: plasmaWindowDiagonalQuarter
      entity: PlasmaWindowDiagonalQuarter
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetPGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Prying
              doAfter: 3
            - tool: Screwing
              doAfter: 2
            - tool: Anchoring
              doAfter: 3

    - node: windowDiagonalQuarter
      entity: WindowDiagonalQuarter
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Anchoring
              doAfter: 2

