- type: constructionGraph
  id: WindowWedge
  start: start
  graph:
    - node: start
      edges:
        - to: plasmaWindowWedge
          steps:
            - material: PlasmaGlass
              amount: 2
              doAfter: 2

        - to: windowWedge
          steps:
            - material: Glass
              amount: 2
              doAfter: 3

        - to: uraniumWindowWedge
          steps:
            - material: UraniumGlass
              amount: 2
              doAfter: 2

    - node: plasmaWindowWedge
      entity: PlasmaWindowWedge
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetPGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Prying
              doAfter: 3
            - tool: Screwing
              doAfter: 2
            - tool: Anchoring
              doAfter: 3

    - node: windowWedge
      entity: WindowWedge
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Anchoring
              doAfter: 2

    - node: uraniumWindowWedge
      entity: UraniumWindowWedge
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetUGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Prying
              doAfter: 3
            - tool: Screwing
              doAfter: 2
            - tool: Anchoring
              doAfter: 3
