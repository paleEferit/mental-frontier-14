- type: constructionGraph
  id: WindowPentagon
  start: start
  graph:
    - node: start
      edges:
        - to: plasmaWindowPentagon
          steps:
            - material: PlasmaGlass
              amount: 2
              doAfter: 2

        - to: windowPentagon
          steps:
            - material: Glass
              amount: 2
              doAfter: 3
          
        - to: uraniumWindowPentagon
          steps:
            - material: UraniumGlass
              amount: 2
              doAfter: 2

        - to: reinforcedPlasmaWindowPentagon
          steps:
            - material: ReinforcedPlasmaGlass
              amount: 2
              doAfter: 3

    - node: plasmaWindowPentagon
      entity: PlasmaWindowPentagon
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetPGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Prying
              doAfter: 3
            - tool: Screwing
              doAfter: 2
            - tool: Anchoring
              doAfter: 3

    - node: windowPentagon
      entity: WindowPentagon
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Anchoring
              doAfter: 2
      
    - node: uraniumWindowPentagon
      entity: UraniumWindowPentagon
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetUGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Prying
              doAfter: 3
            - tool: Screwing
              doAfter: 2
            - tool: Anchoring
              doAfter: 3

    - node: reinforcedPlasmaWindowPentagon
      entity: ReinforcedPlasmaWindowPentagon
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetRPGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Welding
              doAfter: 5
            - tool: Screwing
              doAfter: 2
            - tool: Prying
              doAfter: 3
            - tool: Welding
              doAfter: 5
            - tool: Screwing
              doAfter: 2
            - tool: Anchoring
              doAfter: 3
