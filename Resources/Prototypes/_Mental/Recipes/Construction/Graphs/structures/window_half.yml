- type: constructionGraph
  id: WindowHalf
  start: start
  graph:
    - node: start
      edges:
        - to: plasmaWindowHalf
          steps:
            - material: PlasmaGlass
              amount: 2
              doAfter: 2

        - to: windowHalf
          steps:
            - material: Glass
              amount: 2
              doAfter: 3

        - to: uraniumWindowHalf
          steps:
            - material: UraniumGlass
              amount: 2
              doAfter: 2

    - node: plasmaWindowHalf
      entity: PlasmaWindowHalf
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetPGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Prying
              doAfter: 3
            - tool: Screwing
              doAfter: 2
            - tool: Anchoring
              doAfter: 3

    - node: windowHalf
      entity: WindowHalf
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Anchoring
              doAfter: 2

    - node: uraniumWindowHalf
      entity: UraniumWindowHalf
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetUGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Prying
              doAfter: 3
            - tool: Screwing
              doAfter: 2
            - tool: Anchoring
              doAfter: 3
